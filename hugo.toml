baseURL = "https://go-deltasync.github.io/"
title = "go-deltasync"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[markup.goldmark.renderer]
  unsafe = true

[[params.tools]]
  name = "zsync2"
  blurb = "Download only the changed bytes over plain HTTP."
  ref = "zsync"
  docs = "/docs/latest/zsync2/"
  repo = "https://github.com/go-deltasync/zsync2"
[[params.tools]]
  name = "rdiff"
  blurb = "rsync signature / delta / patch."
  ref = "librsync"
  docs = "/docs/latest/rdiff/"
  repo = "https://github.com/go-deltasync/rdiff"
[[params.tools]]
  name = "chunk"
  blurb = "Cut a stream where the bytes say, not where a counter does."
  ref = "the chunker inside bita, with a name"
  docs = "/docs/latest/chunk/"
  repo = "https://github.com/go-deltasync/chunk"
[[params.tools]]
  name = "zchunk"
  blurb = "Content-defined chunked container + HTTP-Range delta."
  ref = "zchunk (Fedora/DNF)"
  docs = "/docs/latest/zchunk/"
  repo = "https://github.com/go-deltasync/zchunk"
[[params.tools]]
  name = "vcdiff"
  blurb = "VCDIFF (RFC 3284) delta encode/decode."
  ref = "xdelta3"
  docs = "/docs/latest/vcdiff/"
  repo = "https://github.com/go-deltasync/vcdiff"
[[params.tools]]
  name = "bita"
  blurb = "Differential file sync over HTTP (.cba archives)."
  ref = "oll3/bita"
  docs = "/docs/latest/bita/"
  repo = "https://github.com/go-deltasync/bita"

[params.brand]
# Generated by go-fleettools/landingkit from static/favicon.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 4.88:1, bright on the dark background 9.94:1.
  base = "#0079a8"
  deep = "#004a66"
  bright = "#22cce2"
  shadow = "rgba(0,121,168,.7)"
  glow = "rgba(0,121,168,.6)"
  wash = "rgba(0,121,168,.10)"
  washDeep = "rgba(0,74,102,.06)"
  chipBg = "#e4f9fc"
  chipBorder = "#bdf0f6"
  chipFg = "#004a66"
  chipBgDark = "rgba(34,204,226,.14)"
  chipBorderDark = "rgba(34,204,226,.32)"
  chipFgDark = "#85e3ef"
  statsEnd = "#caf3f8"
  bandText = "#dcf7fa"
